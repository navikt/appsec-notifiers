name: Build and deploy main
on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"

jobs:
  naisteamnotifier:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: nais/docker-build-push@0e73849f69ff260ee27597553c0a7848ca4e9795
        id: docker-build-push
        name: Build and push Docker image
        with:
          team: appsec
          image_suffix: naisteam
          pull: true
          build_args: |
            APP=naisteamnotifier
      - uses: nais/deploy/actions/deploy@027a91857992525139798892f2804b0ca21f4af6
        env:
          CLUSTER: prod-gcp
          RESOURCE: .nais/naisteamnotifier.yaml
          IMAGE: ${{ steps.docker-build-push.outputs.IMAGE }}
  secretsnotifier:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: nais/docker-build-push@0e73849f69ff260ee27597553c0a7848ca4e9795
        id: docker-build-push
        name: Build and push Docker image
        with:
          team: appsec
          image_suffix: secrets
          pull: true
          build_args: |
            APP=secretsnotifier
      - uses: nais/deploy/actions/deploy@027a91857992525139798892f2804b0ca21f4af6
        env:
          CLUSTER: prod-gcp
          RESOURCE: .nais/secretsnotifier.yaml
          IMAGE: ${{ steps.docker-build-push.outputs.IMAGE }}